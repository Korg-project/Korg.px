name: Python Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/korg/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/PythonTests.yml'
  pull_request:
    paths:
      - 'src/korg/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/PythonTests.yml'
  workflow_dispatch:

jobs:
  generate-reference:
    name: Generate Julia Reference Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Install Julia dependencies
        run: |
          # Project.toml pins Korg exactly, so this resolves to the targeted
          # release or fails. Print it so the log records which physics the
          # reference data was built from.
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.status("Korg")'

      - name: Generate Julia reference data
        run: |
          julia --project=. tests/generate_julia_reference.jl

      - name: Generate solar synthesis reference
        run: |
          julia --project=. tests/generate_solar_synthesis_reference.jl

      - name: Upload reference data
        uses: actions/upload-artifact@v6
        with:
          name: julia-reference-data
          path: tests/julia_reference_data.json
          retention-days: 1

      - name: Upload solar synthesis reference
        uses: actions/upload-artifact@v6
        with:
          name: julia-solar-synthesis
          path: julia_solar_synthesis.h5
          retention-days: 1

  test:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }}
    needs: generate-reference
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One Python version on purpose. The suite's cost is dominated by XLA
        # compilation and by the synthesis comparisons, neither of which varies
        # across interpreter minor versions -- the three-version matrix was
        # paying triple for the same physics. 3.11 is the one the coverage step
        # below keys on. pyproject declares support for 3.10-3.13, so a release
        # is still worth checking more widely than a push is.
        python-version: ["3.11"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Download Julia reference data
        uses: actions/download-artifact@v7
        with:
          name: julia-reference-data
          path: tests/

      - name: Download solar synthesis reference
        uses: actions/download-artifact@v7
        with:
          name: julia-solar-synthesis
          path: .

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Install Julia dependencies
        run: |
          # Project.toml pins Korg exactly, so this resolves to the targeted
          # release or fails. Print it so the log records which physics the
          # reference data was built from.
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.status("Korg")'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # The MARCS grids are the one artifact CI cannot fake. prepare_synthesis
      # *measures* each line's window at a reference (Teff, logg, [M/H]) rather
      # than guessing it, so it interpolates the grid on every call -- and so
      # does everything built on it. Against the 0-byte placeholder,
      # load_marcs_grid hands back its single-point dummy grid at Teff=5000 and
      # the whole synthesis path dies with
      #
      #     AtmosphereInterpolationError: Teff is out of bounds (5777.0 in [5000.0, 5000.0])
      #
      # which was 36 failures and 72 errors. Placeholders predate the plan, and
      # skipping everything they break would take the synthesis path -- the
      # point of the package -- out of CI entirely. So fetch the real thing.
      #
      # Restore before the placeholder step: create_placeholder_artifact uses
      # Path.touch(), which does not truncate, and is_placeholder_file goes by
      # size, so a restored grid survives that step intact.
      - name: Cache MARCS atmosphere grids
        id: marcs-cache
        uses: actions/cache@v4
        with:
          path: ~/.korg
          key: korg-artifacts-${{ runner.os }}-marcs-v2

      - name: Download MARCS atmosphere grids
        if: steps.marcs-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          from korg.marcs_interpolation import get_marcs_grid_path
          for grid in ("standard", "low_Z", "cool_dwarfs"):
              print(f"{grid}: {get_marcs_grid_path(grid, auto_download=True)}")
          PY

      - name: Setup CI artifacts (placeholders)
        run: |
          python .github/scripts/setup_ci_artifacts.py

      # The XLA executables the suite compiles are keyed by a hash of the HLO
      # module plus the jaxlib version, so a stale entry can never be wrong --
      # it simply will not be hit. Restoring it skips the chemical-equilibrium
      # kernel build, which is the bulk of the run.
      - name: Cache compiled JAX kernels
        uses: actions/cache@v4
        with:
          path: .jax_cache
          key: jax-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/korg/**/*.py', 'pyproject.toml') }}
          restore-keys: |
            jax-cache-${{ runner.os }}-py${{ matrix.python-version }}-

      # -n 1 on purpose: the hosted runners have two cores, so extra workers
      # contend for CPU and each one pays its own compilation. Locally,
      # run_tests.sh uses -n 8.
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -n 1

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          pip install pytest pytest-cov
          pytest tests/ --cov --cov-branch --cov-report=xml -n 1

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          slug: Korg-project/Korg.px
          fail_ci_if_error: true
